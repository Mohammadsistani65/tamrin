<title>ماشین مشتری | کارگروه اصفهان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<style>
:root{--tq:#0f7c86;--tq2:#0a4f5a;--tq3:#e2f3f2;--gold:#c79a3b;--gold2:#f3e3b8;--cream:#fbf6ea;--ink:#1d2b30;--mut:#697a7f;--line:#e7dfcb;--ok:#1f8f5f;--warn:#c27a12;--bad:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Vazirmatn','Vazir','Tahoma','Segoe UI',sans-serif;background:var(--cream);color:var(--ink);direction:rtl;line-height:1.75;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
#art{position:fixed;inset:0;z-index:0;display:none}
#art svg{width:100%;height:100%;display:block}
body.art #art{display:block}
body.art{background:#0c2347}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:70px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 16px 26px}
.login .ttl{position:absolute;top:34px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.ttl small{display:block;letter-spacing:.5px;opacity:.9;font-size:13px}
.ttl h1{margin:2px 0 0;font-size:34px;font-weight:800}
.ttl .sub{font-size:14px;margin-top:4px;color:#f3e3b8}
.glass{background:rgba(251,246,234,.93);border:1px solid rgba(199,154,59,.55);border-radius:20px;padding:18px 16px;backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.lbl{display:block;font-size:13px;color:var(--tq2);font-weight:600;margin:10px 0 4px}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none;transition:.15s}
.inp:focus{border-color:var(--tq);box-shadow:0 0 0 3px rgba(15,124,134,.15)}
textarea.inp{min-height:84px;resize:vertical}
.ltr{direction:ltr;text-align:center;letter-spacing:6px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:#fff;border:1.5px solid var(--tq);color:var(--tq2)}
.btn.pri{background:linear-gradient(135deg,var(--tq),var(--tq2));color:#fff;border-color:transparent}
.btn.gold{background:var(--gold);color:#fff;border-color:transparent}
.btn.block{display:block;width:100%;margin-top:14px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
.links{display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:12.5px}
.links a{color:#f3e3b8;cursor:pointer;text-decoration:underline}
.credit{text-align:center;font-size:11.5px;color:#d9d2bd;margin-top:10px}
.top{background:linear-gradient(135deg,var(--tq2),var(--tq));color:#fff;padding:14px 16px 16px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}
.top .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h2{margin:0;font-size:17px}
.top .sm{font-size:12.5px;opacity:.9}
.top .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.45)}
.wrap{padding:14px 14px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(60,50,20,.05)}
.card h3{margin:0 0 8px;font-size:15.5px;color:var(--tq2)}
.sec{font-weight:800;color:var(--tq2);margin:18px 2px 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:6px;height:18px;background:var(--gold);border-radius:3px}
.rings{display:flex;gap:10px}
.ringbox{flex:1;text-align:center;background:var(--tq3);border-radius:14px;padding:10px 4px}
.ringbox svg{width:72px;height:72px}
.ringbox .t{font-size:12.5px;color:var(--tq2);font-weight:700}
.ringbox .n{font-size:11.5px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.stat{background:#faf5e6;border-radius:12px;padding:8px 10px;font-size:12.5px;color:var(--mut)}
.stat b{display:block;font-size:17px;color:var(--ink)}
.its{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.it{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;cursor:pointer;text-align:right;font-weight:600;font-size:13.5px}
.it .ic{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:#eee;color:#888;flex:none}
.st-part .ic{background:#fdeccb;color:var(--warn)}
.st-done{border-color:#9bd6c2}.st-done .ic{background:#d9f2e9;color:var(--ok)}
.st-ok{border-color:var(--ok);background:#effaf5}.st-ok .ic{background:var(--ok);color:#fff}
.st-fix{border-color:var(--bad);background:#fdf0ee}.st-fix .ic{background:var(--bad);color:#fff}
.dl{background:#fff6dd;border:1px solid #ecd48b;color:#7a5a10;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.hint{background:#f1f8f8;border-right:4px solid var(--tq);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.hint ul{margin:4px 0 0;padding-right:18px}
.help{font-size:12.5px;color:var(--mut);background:#faf5e6;border-radius:8px;padding:6px 10px;margin:2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--tq);border-color:var(--tq);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--tq);flex:none}
.cp{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:#fffdf7}
.cp.on{border-color:#9bd6c2;background:#f2fbf7}
.cmp{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:4}
.cmp .s{font-size:13px;font-weight:700}
.s.ok{color:var(--ok)}.s.no{color:var(--warn)}
.cm{border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:8px}
.cm.a{background:#fdf0ee;border:1px solid #f1c3bc}.cm.s2{background:#eef5ff;border:1px solid #c5d9f5}
.badge{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:700}
.b-ok{background:#d9f2e9;color:var(--ok)}.b-fix{background:#fde0dc;color:var(--bad)}.b-done{background:#e3f1f6;color:var(--tq2)}.b-no{background:#eee;color:#888}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:center;white-space:nowrap}
.tbl th{background:var(--tq3);color:var(--tq2);position:sticky;top:0}
.tbl td:first-child,.tbl th:first-child{text-align:right}
.tbl tr.rw{cursor:pointer}.tbl tr.rw:hover{background:#faf5e6}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.bar{height:7px;border-radius:5px;background:#eee;overflow:hidden;min-width:50px}.bar i{display:block;height:100%;background:var(--tq)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs .btn{flex:1;padding:8px 4px;font-size:13px}.tabs .btn.on{background:var(--tq);color:#fff}
.kv{font-size:13.5px;border-bottom:1px dashed var(--line);padding:5px 0}
.kv b{color:var(--tq2)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1d2b30;color:#fff;border-radius:20px;padding:8px 18px;font-size:13px;z-index:20;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.demo{background:#fff1c7;color:#6b4d00;text-align:center;font-size:12px;padding:4px 8px}
.foot{text-align:center;font-size:11.5px;color:var(--mut);margin:20px 0}
.row2{display:flex;gap:8px;align-items:center}
.row2>*{flex:1}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>

const toEn=s=>String(s==null?'':s).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const DATE_RE=/^1[34]\d\d\/(0[1-9]|1[0-2])\/(0[1-9]|[12]\d|3[01])$/;
function jToday(){try{const p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const g=t=>(p.find(x=>x.type===t)||{}).value;return g('year')+'/'+g('month')+'/'+g('day')}catch(e){return ''}}

function filled(f,v){
  if(f.type==='check')return v===true;
  if(f.type==='chips'||f.type==='select')return !!v;
  if(f.type==='date')return DATE_RE.test(v||'');
  return String(v||'').trim().length>=(f.min||1);
}
function fieldsOf(kind,d){return SCHEMA[kind].fields.filter(f=>f.type!=='cp'&&f.req!==false&&(!f.showIf||f.showIf(d||{})))}
function missing(key,val){const kind=SCHEMA[key]?key:kindOf(key);const d=val||{};return fieldsOf(kind,d).filter(f=>!filled(f,d[f.id])).map(f=>f.label)}
function complete(key,val){return !!val&&missing(key,val).length===0}
function hasData(v){if(v==null)return false;if(typeof v==='string')return v.trim().length>0;if(typeof v==='boolean')return v===true;if(Array.isArray(v))return v.some(hasData);if(typeof v==='object')return Object.values(v).some(hasData);return !!v}
function status(key,data,rev){
  const r=rev[key];
  if(r&&r.status==='approved')return 'ok';
  if(r&&r.status==='revise')return 'fix';
  if(complete(key,data[key]))return 'done';
  return hasData(data[key])?'part':'empty';
}
const ICON={empty:'○',part:'◐',done:'●',ok:'✓',fix:'!'};
function stats(data,rev){
  data=data||{};rev=rev||{};
  const done=REQ.filter(k=>complete(k,data[k])).length;
  const appr=REQ.filter(k=>rev[k]&&rev[k].status==='approved').length;
  const fix=REQ.filter(k=>rev[k]&&rev[k].status==='revise').length;
  let follow=0,given=0,won=0,asked=0,custs=0;const methods=new Set(),types=new Set();let lvl=-1;
  for(let n=1;n<=5;n++){
    const a=data['cust'+n+'_analysis'];if(complete('cust'+n+'_analysis',a)){custs++;types.add(a.ctype)}
    const o=data['cust'+n+'_order'];if(o&&o.given===YES1){given++;if(o.result==='سفارش گرفتم')won++}
    const l=data['cust'+n+'_loyalty'];if(l&&l.cp)for(let i=0;i<6;i++){const c=l.cp[i];if(c&&c.done){follow++;if(c.method)methods.add(c.method)}}
    const r=data['cust'+n+'_referral'];if(r&&r.asked===YES2){asked++;const m=/^([۰-۳])/.exec(r.level||'');if(m)lvl=Math.max(lvl,'۰۱۲۳'.indexOf(m[1]))}
  }
  return{done,appr,fix,total:REQ.length,act:Math.round(done/REQ.length*100),mas:Math.round(appr/REQ.length*100),follow,given,won,asked,custs,types:types.size,methods:methods.size,lvl};
}

  },
  supervisors(){return this.rpc('mm_list_supervisors')},

  register(n,p,s){return this.rpc('mm_member_register',{p_name:n,p_pin:p,p_sup:s})},

  adminMove(p,m,s){return this.rpc('mm_admin_move',{p_pin:p,p_member:m,p_slug:s})},

  '<div class="links"><a id="ls">ورود مسئول پیگیری</a><a id="la">ورود مدیر</a></div><div class="credit">طراح: محمد سیستانی | نسخه ۲ | '+(DEMO?'حالت آزمایشی':'متصل به پایگاه داده')+'</div></div>';
  if(msg)document.getElementById('er').textContent=msg;

async function doLogin(){
  const name=document.getElementById('nm').value.replace(/\s+/g,' ').trim(),pin=toEn(document.getElementById('pn').value).trim();
  const er=m=>{document.getElementById('er').textContent=m};
  if(name.length<2)return er('نام را کامل وارد کنید');
  if(!/^\d{4}$/.test(pin))return er('رمز باید دقیقاً ۴ رقم باشد');
  S.lastName=name;S.lastPin=pin;
  const go=document.getElementById('go');go.disabled=true;
  try{
    let res;
    if(S.reg){const sp=document.getElementById('sp').value;if(!sp){go.disabled=false;return er('مسئول پیگیری را انتخاب کنید')}res=await api.register(name,pin,sp)}
    else res=await api.login(name,pin);
    if(res.status==='not_found'){S.reg=true;S.preSup=Q.get('r')||'';go.disabled=false;return renderLogin()}
    if(res.status==='exists'){S.reg=false;go.disabled=false;return er('این نام قبلاً ثبت شده است؛ رمز را وارد کنید')}
    if(res.status==='bad_pin'){go.disabled=false;return er('رمز اشتباه است')}
    if(res.status==='locked'){go.disabled=false;return er('چند بار رمز اشتباه زده شد؛ ۱۰ دقیقه بعد دوباره تلاش کنید')}
    if(res.status!=='ok'){go.disabled=false;return er('خطا در ورود؛ دوباره تلاش کنید')}
    S.lastPin='';S.creds={name:res.member.name,pin};localStorage.setItem('nm_sess',JSON.stringify(S.creds));
    enter(res);
  }catch(e){go.disabled=false;er(e&&e.status===404?'پایگاه داده آماده نیست: فایل SQL نسخه‌ی جدید را در Supabase اجرا کنید':'اتصال برقرار نشد؛ اینترنت را بررسی کنید')}
}
function enter(res){S.member=res.member;S.data=res.data||{};S.rev=res.reviews||{};S.reg=false;renderHome()}
async function refresh(){try{const r=await api.login(S.creds.name,S.creds.pin);if(r.status==='ok'){S.rev=r.reviews||{};if(S.view==='home')renderHome()}}catch(e){}}
function logout(){localStorage.removeItem('nm_sess');S.creds=null;S.member=null;S.data={};S.rev={};S.reg=false;renderLogin()}

  h+='<div class="card"><div class="stats" style="margin:0"><div class="stat">پیگیری انجام‌شده<b>'+fa(st.follow)+'</b></div><div class="stat">مدل‌های پیگیری<b>'+fa(st.methods)+' از ۵</b></div><div class="stat">سفارش داده / گرفته<b>'+fa(st.given)+' / '+fa(st.won)+'</b></div><div class="stat">تیپ‌های شناسایی‌شده<b>'+fa(st.types)+' از ۶</b></div></div></div>';
  keys.forEach(k=>{
    const val=m.data[k],r=m.reviews[k]||{},s=status(k,m.data,m.reviews),cm=complete(k,val);
    const badge={ok:'<span class="badge b-ok">تأیید شده</span>',fix:'<span class="badge b-fix">نیاز به اصلاح</span>',done:'<span class="badge b-done">کامل</span>',part:'<span class="badge b-no">ناقص</span>',empty:'<span class="badge b-no">ثبت نشده</span>'}[s];
    h+='<div class="card"><h3>'+esc(keyTitle(k))+' '+badge+'</h3>'+(hasData(val)?valueHtml(k,val):'<div class="note">چیزی ثبت نشده است.</div>');
    if(r.sup&&adm)h+='<div class="cm s2" style="margin-top:8px"><b>پیام مسئول:</b> '+esc(r.sup)+'</div>';
    if(r.admin&&!adm)h+='<div class="cm a" style="margin-top:8px"><b>پیام مدیر:</b> '+esc(r.admin)+'</div>';
    h+='<label class="lbl">'+(adm?'پیام مدیر به عضو':'پیام شما به عضو')+'</label><textarea class="inp" style="min-height:56px" data-c="'+k+'">'+esc(adm?r.admin||'':r.sup||'')+'</textarea><div class="flex" style="margin-top:8px">';
    if(adm){
      h+='<button class="btn sm pri" data-a="rv" data-k="'+k+'" data-s="approved"'+(cm?'':' style="opacity:.45"')+'>✓ تأیید</button><button class="btn sm bad" data-a="rv" data-k="'+k+'" data-s="revise">! نیاز به اصلاح</button><button class="btn sm" data-a="rv" data-k="'+k+'" data-s="none">پاک‌کردن وضعیت</button>';
    }else h+='<button class="btn sm pri" data-a="sc" data-k="'+k+'">ثبت پیام</button>';
    h+='</div></div>';
  });
  $app.innerHTML=h+'</div>';
}
function valueHtml(key,val){
  const kind=SCHEMA[key]?key:kindOf(key),sc=SCHEMA[kind];let h='';
  sc.fields.forEach(f=>{
    if(f.showIf&&!f.showIf(val))return;
    if(f.type==='cp'){
      (val.cp||[]).forEach((c,i)=>{if(c&&c.done)h+='<div class="kv"><b>روز '+fa(DAYS[i])+'</b>: '+esc(c.method||'')+' | '+esc(c.date||'')+(c.note?' | '+esc(c.note):'')+'</div>'});return}
    const v=val[f.id];
    h+='<div class="kv"><b>'+esc(f.type==='check'?f.label:f.label.split(' (')[0])+':</b> '+(f.type==='check'?(v?'✓':'✗'):esc(v||'—'))+'</div>';
  });
  return h;
}
function csv(){
  const P=S.panel;
  const rows=[['نام','مسئول','اقدام٪','تسلط٪','مشتری تحلیل‌شده','پیگیری انجام‌شده','مدل‌های پیگیری','سفارش پیشنهادشده','سفارش گرفته‌شده','درخواست معرفی','تأییدشده','نیاز به اصلاح']];
  P.members.forEach(m=>{const s=stats(m.data,m.reviews);rows.push([m.name,supName(m.sup_slug),s.act,s.mas,s.custs,s.follow,s.methods,s.given,s.won,s.asked,s.appr,s.fix])});
  const t='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='machine-moshtari-report.csv';document.body.appendChild(a);a.click();a.remove();
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('لینک کپی شد'),()=>prompt('لینک را کپی کنید',t));
  else prompt('لینک را کپی کنید',t);
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,P=S.panel;
  if(a==='logout')return logout();
  if(a==='refresh'){await refresh();return toast('بروزرسانی شد')}
  if(a==='more'){S.showN=Math.min(5,visCount()+1);return renderHome()}
  if(a==='open'){S.key=el.dataset.k;S.saving='';return renderEdit()}
  if(a==='back'){await saveNow();S.key=null;return renderHome()}
  if(a==='saveNow'){await saveNow();toast(S.saving);return}
  if(a==='chip'){const d=S.data[S.key];setPath(d,el.dataset.f,el.dataset.v);const y=window.scrollY;renderEdit();window.scrollTo(0,y);queueSave();return}
  if(a==='today'){const d=S.data[S.key];setPath(d,el.dataset.f,jToday());const y=window.scrollY;renderEdit();window.scrollTo(0,y);queueSave();return}
  if(a==='pexit'){S.panel=null;return renderLogin()}
  if(a==='preload'){await reloadPanel();renderPanel();return toast('بروزرسانی شد')}
  if(a==='ptab'){P.tab=el.dataset.v;return renderPanel()}
  if(a==='pm'){P.m=+el.dataset.id;return renderPanel()}
  if(a==='pback'){P.m=null;return renderPanel()}
  if(a==='csv')return csv();
  if(a==='copy')return copyText(el.dataset.u);
  if(a==='supin'){const v=toEn(prompt('رمز جدید این مسئول را وارد کنید (حداقل ۴ رقم)')||'').trim();if(v.length<4)return;const r=await api.adminSetSupPin(P.pin,el.dataset.s,v);return toast(r.status==='ok'?'رمز تغییر کرد':'ناموفق')}
  if(a==='addsup'){const n=document.getElementById('an').value.trim(),s=document.getElementById('as').value.trim().toLowerCase(),p=toEn(document.getElementById('ap').value).trim();if(!n||!/^[a-z0-9-]{2,30}$/.test(s)||p.length<4)return toast('نام، شناسه‌ی انگلیسی و رمز ۴ رقمی را کامل کنید');const r=await api.adminAddSup(P.pin,s,n,p);if(r.status!=='ok')return toast('ناموفق (شناسه تکراری؟)');await reloadPanel();S.sups=await api.supervisors();return renderPanel()}
  if(a==='move'){const r=await api.adminMove(P.pin,P.m,document.getElementById('mv').value);if(r.status==='ok'){await reloadPanel();toast('انتقال انجام شد');renderPanel()}return}
  if(a==='rpin'){const v=toEn(prompt('رمز ۴ رقمی جدید عضو')||'').trim();if(!/^\d{4}$/.test(v))return;const r=await api.adminResetPin(P.pin,P.m,v);return toast(r.status==='ok'?'رمز تغییر کرد':'ناموفق')}
  if(a==='rv'){
    const k=el.dataset.k,m=P.members.find(x=>x.id===P.m),c=(document.querySelector('[data-c="'+k+'"]')||{}).value||'';
    if(el.dataset.s==='approved'&&!complete(k,m.data[k]))return toast('این مورد هنوز کامل نیست و قابل تأیید نیست');
    const r=await api.adminReview(P.pin,P.m,k,el.dataset.s,c);if(r.status!=='ok')return toast('ثبت نشد');
    await reloadPanel();const y=window.scrollY;renderPanel();window.scrollTo(0,y);return toast('ثبت شد');
  }
  if(a==='sc'){
    const k=el.dataset.k,c=(document.querySelector('[data-c="'+k+'"]')||{}).value||'';
    const r=await api.supComment(P.slug,P.pin,P.m,k,c);if(r.status!=='ok')return toast('ثبت نشد');
    await reloadPanel();const y=window.scrollY;renderPanel();window.scrollTo(0,y);return toast('پیام ثبت شد');
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(S.view!=='edit'||!el.dataset.f)return;
  const d=S.data[S.key];
  if(el.type==='checkbox'){setPath(d,el.dataset.f,el.checked);const y=window.scrollY;renderEdit();window.scrollTo(0,y)}
  else setPath(d,el.dataset.f,el.value);
  queueSave();updCmp();
});
document.addEventListener('focusout',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.date){let v=toEn(el.value).replace(/[-.]/g,'/').trim();el.value=v;setPath(S.data[S.key],el.dataset.f,v);queueSave();updCmp()}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.a==='pf'){S.panel.f=el.value;renderPanel()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view==='home'&&S.creds)refresh()});

/* ---------- boot ---------- */
(async function(){
  try{S.sups=await api.supervisors();if(!S.sups||!S.sups.length)S.sups=SUPS0}catch(e){S.sups=SUPS0}
  if(Q.has('admin'))return renderStaffLogin('admin');
  if(Q.get('s'))return renderStaffLogin('sup');
  try{
    const s=JSON.parse(localStorage.getItem('nm_sess')||'null');
    if(s&&s.name&&s.pin){const r=await api.login(s.name,s.pin);if(r.status==='ok'){S.creds=s;return enter(r)}}
  }catch(e){}
  renderLogin();
})();
</script>
